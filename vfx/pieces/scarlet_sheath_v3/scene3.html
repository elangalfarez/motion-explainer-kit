<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Serif;src:url(serif.woff2)}
@font-face{font-family:Brush;src:url(brush.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ============================================================
//  SCARLET SHEATH — 100% procedural recreation (Canvas 2D)
//  render(t) is pure: same t -> same frame. No images, no footage.
// ============================================================
const W=1920,H=1080, C=document.getElementById('c'), X=C.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=t=>1-Math.pow(1-t,3), eIn=t=>t*t*t, eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}

// ---------- colours ----------
const PAPER='#ecebe6', INK='#141014', RED='#c8102e', GOLD='#d9a441';

// ---------- offscreen helpers ----------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const bloomC=mk(480,270), bloomX=bloomC.getContext('2d');
const tmpC=mk(W,H), tmpX=tmpC.getContext('2d');
// dot-grid paper pattern
const gridPat=(()=>{const c=mk(14,14),x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.06)';x.beginPath();x.arc(7,7,1.1,0,TAU);x.fill();return X.createPattern(c,'repeat')})();
// dark halftone pattern
function dotPat(step,r,col){const c=mk(step,step),x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(step/2,step/2,r,0,TAU);x.fill();return X.createPattern(c,'repeat')}
const darkDots=dotPat(8,1.6,'rgba(255,90,40,.10)');
const redDots=dotPat(7,2.3,'rgba(255,120,80,.45)');
const blackDots=dotPat(9,3.2,'rgba(20,10,10,.9)');

// ---------- glow stroke: layered additive passes ----------
function glow(drawPath,core,mid,outer,w,alpha=1){
  X.save();X.globalCompositeOperation='lighter';X.lineCap='round';X.lineJoin='round';
  const passes=[[w*7,outer,.10],[w*3.5,outer,.22],[w*1.8,mid,.55],[w,core,1]];
  for(const[lw,c,a]of passes){X.globalAlpha=a*alpha;X.strokeStyle=c;X.lineWidth=lw;X.beginPath();drawPath();X.stroke()}
  X.restore();
}
function bloom(amount){
  if(amount<=0)return;
  bloomX.globalCompositeOperation='copy';bloomX.filter='blur(5px)';
  bloomX.drawImage(C,0,0,480,270);bloomX.filter='none';
  X.save();X.globalCompositeOperation='lighter';X.globalAlpha=amount;X.imageSmoothingEnabled=true;
  X.drawImage(bloomC,0,0,W,H);X.restore();
}
function vignette(a){const g=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);X.fillStyle=g;X.fillRect(0,0,W,H)}

// tapered brush arc (ink stroke)
function brushArc(cx,cy,r,a0,a1,w,col,alpha=1){
  const n=28;X.save();X.globalAlpha=alpha;X.fillStyle=col;X.beginPath();
  for(let i=0;i<=n;i++){const u=i/n,a=lerp(a0,a1,u),ww=w*Math.sin(Math.PI*Math.pow(u,.7))+.3;X.lineTo(cx+Math.cos(a)*(r+ww/2),cy+Math.sin(a)*(r+ww/2))}
  for(let i=n;i>=0;i--){const u=i/n,a=lerp(a0,a1,u),ww=w*Math.sin(Math.PI*Math.pow(u,.7))+.3;X.lineTo(cx+Math.cos(a)*(r-ww/2),cy+Math.sin(a)*(r-ww/2))}
  X.closePath();X.fill();X.restore();
}

// ============================================================
//  THE KATANA (all vector). Local space: tsuba at (0,0),
//  handle toward -y, sheath toward +y.  draw = how far blade is out.
// ============================================================
function roundRect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function drawHilt(){ // tsuka + tsuba, around (0,0)
  // tsuka core
  X.lineWidth=5;X.strokeStyle=INK;
  roundRect(-23,-262,46,250,8);X.fillStyle='#1c1a1f';X.fill();X.stroke();
  // ito wrap diamonds
  X.save();roundRect(-23,-262,46,250,8);X.clip();
  for(let i=0;i<8;i++){const y=-250+i*30;
    X.fillStyle='#efe9dd';X.strokeStyle=INK;X.lineWidth=2.5;
    X.beginPath();X.moveTo(-26,y);X.lineTo(26,y+24);X.lineTo(26,y+30);X.lineTo(-26,y+6);X.closePath();X.fill();X.stroke();
    X.beginPath();X.moveTo(26,y);X.lineTo(-26,y+24);X.lineTo(-26,y+30);X.lineTo(26,y+6);X.closePath();X.fill();X.stroke();
    X.fillStyle='#7a1020';X.beginPath();X.moveTo(0,y+9);X.lineTo(6,y+15);X.lineTo(0,y+21);X.lineTo(-6,y+15);X.closePath();X.fill();}
  X.restore();
  // menuki gold
  X.fillStyle=GOLD;X.beginPath();X.ellipse(4,-150,6,16,0,0,TAU);X.fill();
  // kashira cap
  roundRect(-26,-282,52,26,6);X.fillStyle=GOLD;X.fill();X.lineWidth=4;X.stroke();
  X.fillStyle='rgba(255,255,255,.35)';X.fillRect(-18,-278,10,18);
  // fuchi collar
  roundRect(-25,-16,50,14,3);X.fillStyle=GOLD;X.fill();X.stroke();
  // tsuba
  X.beginPath();X.ellipse(0,0,54,13,0,0,TAU);X.fillStyle='#8a5a12';X.fill();X.lineWidth=5;X.stroke();
  X.beginPath();X.ellipse(0,-3,46,8,0,0,TAU);X.fillStyle=GOLD;X.fill();
  X.beginPath();X.ellipse(-12,-4,14,3,0,0,TAU);X.fillStyle='rgba(255,250,220,.8)';X.fill();
}
function drawBlade(len){ // blade from tsuba along +y
  if(len<=2)return;
  // habaki
  roundRect(-21,8,42,26,3);X.fillStyle=GOLD;X.fill();X.lineWidth=4;X.strokeStyle=INK;X.stroke();
  X.beginPath();X.moveTo(-17,34);X.lineTo(17,34);X.lineTo(15,len-40);X.quadraticCurveTo(14,len-6,-2,len);X.lineTo(-17,len-30);X.closePath();
  const g=X.createLinearGradient(-17,0,17,0);g.addColorStop(0,'#9aa3ad');g.addColorStop(.45,'#f4f6f8');g.addColorStop(.55,'#dfe4ea');g.addColorStop(1,'#7c858f');
  X.fillStyle=g;X.fill();X.lineWidth=4;X.stroke();
  // hamon (wavy temper line)
  X.beginPath();for(let y=40;y<len-30;y+=6){X.lineTo(4+Math.sin(y*.12)*3.5,y)}X.strokeStyle='rgba(255,255,255,.95)';X.lineWidth=2;X.stroke();
  X.beginPath();X.moveTo(-9,40);X.lineTo(-9,len-40);X.strokeStyle='rgba(60,70,80,.4)';X.lineWidth=1.5;X.stroke();
}
function drawSaya(charms,t){ // sheath from y=26 to 660
  const top=26,bot=660;
  X.lineWidth=5;X.strokeStyle=INK;
  X.beginPath();X.moveTo(-21,top);X.lineTo(21,top);X.lineTo(18,bot-20);X.lineTo(-18,bot-20);X.closePath();
  X.fillStyle='#17121a';X.fill();X.stroke();
  // lacquer weave
  X.save();X.clip();X.strokeStyle='rgba(120,40,70,.35)';X.lineWidth=3;
  for(let y=top;y<bot;y+=11){X.beginPath();X.moveTo(-22,y);X.lineTo(22,y+16);X.stroke()}
  X.fillStyle='rgba(255,255,255,.08)';X.fillRect(-12,top,6,bot);
  // gold cracks (kintsugi)
  X.strokeStyle=GOLD;X.lineWidth=2.2;X.beginPath();
  X.moveTo(-15,70);X.lineTo(-4,120);X.lineTo(8,150);X.lineTo(2,210);X.lineTo(14,260);X.lineTo(6,330);
  X.moveTo(-4,120);X.lineTo(-14,175);X.moveTo(8,150);X.lineTo(18,175);X.moveTo(2,210);X.lineTo(-12,250);X.stroke();
  X.restore();
  // koiguchi + kurikata gold bands
  roundRect(-23,top,46,12,2);X.fillStyle=GOLD;X.fill();X.stroke();
  roundRect(-23,170,46,14,2);X.fillStyle=GOLD;X.fill();X.stroke();
  // red wrapped lower section
  X.beginPath();X.moveTo(-19,bot-150);X.lineTo(19,bot-150);X.lineTo(18,bot-24);X.lineTo(-18,bot-24);X.closePath();X.fillStyle='#a3101f';X.fill();X.stroke();
  X.save();X.clip();X.strokeStyle='rgba(60,0,10,.5)';X.lineWidth=2;for(let y=bot-150;y<bot;y+=7){X.beginPath();X.moveTo(-20,y);X.lineTo(20,y+3);X.stroke()}X.restore();
  roundRect(-22,bot-158,44,10,2);X.fillStyle=GOLD;X.fill();X.stroke();
  // kojiri
  X.beginPath();X.moveTo(-19,bot-24);X.lineTo(19,bot-24);X.lineTo(17,bot);X.quadraticCurveTo(0,bot+10,-17,bot);X.closePath();X.fillStyle=GOLD;X.fill();X.stroke();
  // sageo cord + tassel
  const sw=Math.sin(t*3)*8;
  X.strokeStyle='#d01e1e';X.lineWidth=5;X.beginPath();X.moveTo(18,178);X.bezierCurveTo(60,200,70+sw,260,62+sw,320);X.stroke();
  X.strokeStyle='#ff5a3c';X.lineWidth=1.6;X.beginPath();X.moveTo(18,178);X.bezierCurveTo(60,200,70+sw,260,62+sw,320);X.stroke();
  X.fillStyle=GOLD;X.beginPath();X.arc(62+sw,322,6,0,TAU);X.fill();
  X.strokeStyle='#ff3b1f';X.lineWidth=2;for(let i=-3;i<=3;i++){X.beginPath();X.moveTo(62+sw,326);X.lineTo(62+sw+i*3,350);X.stroke()}
  if(charms){ // ofuda paper charms
    for(let k=0;k<2;k++){X.save();X.translate(-6+k*30,110);X.rotate(-KROT*.92+Math.sin(t*2+k)*.08-.05);
      roundRect(-13,0,26,120,2);X.fillStyle='#f4efe2';X.fill();X.lineWidth=3;X.strokeStyle=INK;X.stroke();
      X.fillStyle='#c8102e';X.font='900 18px Serif';X.textAlign='center';X.fillText('封',0,30);if(k)X.fillText('斷',0,100);X.restore()}
  }
}
// full katana at (x,y) rotation rot, scale s, blade "drawn" offset along axis
let KROT=0;
function katana(x,y,rot,s,opt={}){
  const t=opt.t||0, out=opt.out||0; // out: px the hilt+blade is pulled out (toward -y)
  KROT=rot;X.save();X.translate(x,y);X.rotate(rot);X.scale(s,s);
  if(opt.shadow){X.save();X.translate(10,14);X.globalAlpha=.12;X.fillStyle='#000';X.fillRect(-22,-280,44,940);X.restore()}
  drawSaya(opt.charms!==false,t);
  if(!opt.noHilt){X.save();X.translate(0,-out);drawBlade(Math.min(out+20,640)*(out>0?1:0));drawHilt();X.restore();}
  X.restore();
}

// ============================================================
//  TITLE CARD (top-left) with glitch decode
// ============================================================
function glitchText(txt,x,y,font,fill,t,lockT,seed,stroke){
  X.save();X.font=font;X.textBaseline='alphabetic';
  const glitching=t<lockT;
  if(!glitching){if(stroke){X.lineWidth=stroke[1];X.strokeStyle=stroke[0];X.lineJoin='round';X.strokeText(txt,x,y)}X.fillStyle=fill;X.fillText(txt,x,y);X.restore();return}
  const m=X.measureText(txt), w=m.width, h=parseInt(font.match(/(\d+)px/)[1]);
  const fr=Math.floor(t*30), r=rng(seed+fr*31);
  const slices=7;
  for(let i=0;i<slices;i++){
    X.save();X.beginPath();X.rect(x-20,y-h+i*(h*1.2/slices),w+60,h*1.2/slices+1);X.clip();
    const off=(r()-.5)*40*(1-t/lockT);
    if(stroke){X.lineWidth=stroke[1];X.strokeStyle=stroke[0];X.strokeText(txt,x+off,y)}
    X.fillStyle=r()<.25?'#ff3b1f':fill;X.fillText(txt,x+off,y);X.restore();
  }
  // pixel blocks
  for(let i=0;i<10;i++){X.fillStyle=['#ff3b1f','#111','#fff','#ffb347'][i%4];X.globalAlpha=.8;X.fillRect(x+r()*w,y-h+r()*h,6+r()*26,4+r()*10)}
  X.restore();
}
function titleCard(t,dark,alpha){
  if(alpha<=0)return;
  X.save();X.globalAlpha=alpha;
  const p=seg(t,0,.35);
  glitchText('緋鞘',44,96,'900 64px Serif','#f6f3ee',t,.45,11,['#1a1416',9]);
  glitchText('SCARLET SHEATH',46,160,'700 26px "DejaVu Sans Mono"',dark?'#efe7e0':'#1a1416',t,.6,22);
  // black plate
  const pw=430*eOut(seg(t,.1,.45));
  X.fillStyle='rgba(12,8,10,.96)';X.fillRect(30,178,pw,98);
  if(t>.2){
    X.save();X.beginPath();X.rect(30,178,pw,98);X.clip();
    const g=X.createLinearGradient(0,200,0,262);g.addColorStop(0,'#ffd36b');g.addColorStop(.5,'#ff6a1f');g.addColorStop(1,'#c8102e');
    glitchText('一閃・斷界',60,250,'900 60px Serif',g,t,.9,33);
    X.restore();
  }
  // tiny squares
  const cols=['#ff5a2a','#9aa','#9aa','#9aa'];
  for(let i=0;i<4;i++){X.fillStyle=cols[i];X.globalAlpha=alpha*(t>.5+i*.05?1:0);X.fillRect(486+i*14,272,9,9)}
  X.globalAlpha=alpha;
  glitchText('ISSEN · WORLD SEVER',48,312,'600 17px "DejaVu Sans Mono"',dark?'#8f8a88':'#6d6865',t,.75,44);
  X.restore();
}

// ============================================================
//  PRE-BAKED PARTICLE SYSTEMS (seeded)
// ============================================================
const R=rng(7);
const inkArcs=[...Array(16)].map(()=>({r:200+R()*620,a:R()*TAU,len:.35+R()*.6,w:4+R()*7,sp:(R()<.5?-1:1)*(1.2+R()*1.6),red:R()<.2}));
const streaks=[...Array(48)].map(()=>({r:120+R()*700,a:R()*TAU,len:.2+R()*.5,sp:1.5+R()*3,w:2+R()*4,ox:(R()-.5)*300,oy:(R()-.5)*200}));
const shards=[...Array(70)].map(()=>({x:(R()-.5)*2200,y:(R()-.5)*1300,vx:(R()-.5)*600,vy:(R()-.5)*600,s:6+R()*16,rot:R()*TAU,vr:(R()-.5)*8}));
const blades=[...Array(34)].map(()=>({u:R()*2-1,side:R()<.5?-1:1,len:120+R()*380,w:8+R()*22,d:R()*.25}));
const embers=[...Array(160)].map(()=>({x:R()*W,y:R()*H,vx:(R()-.5)*80,vy:-20-R()*60,s:1+R()*3.5,hot:R()<.35,ph:R()*TAU}));
const swirl=[...Array(46)].map(()=>({r:30+R()*190,a:R()*TAU,len:.25+R()*.5,w:3+R()*7}));
const sparks=[...Array(120)].map(()=>({a:R()*TAU,v:200+R()*900,s:2+R()*4,d:R()*.3}));
const inkDots=[...Array(90)].map(()=>({x:R()*W,y:R()*H,s:4+R()*18,col:R()<.6?INK:(R()<.6?RED:'#8d8a88'),vx:(R()-.5)*500,vy:(R()-.5)*300}));
const splat=[...Array(26)].map(()=>({a:R()*TAU,d:80+R()*180,s:2+R()*7}));
const bolts=[...Array(14)].map((_,i)=>({u:(i/14)*2-1+R()*.1,side:i%2?1:-1,seed:Math.floor(R()*1e6),len:80+R()*160}));

// ============================================================
//  GEOMETRY: the lens / rift / eye-rim
//  local frame: rotated band, half-length L, half-height Hh
// ============================================================
function lensPts(L,Hh,jit,t,seed,n=90){
  const top=[],bot=[];
  for(let i=0;i<=n;i++){const u=i/n*2-1,x=u*L,prof=Math.pow(1-u*u,.85);
    const j1=jit*noise1(u*18+t*14+seed),j2=jit*noise1(u*18+t*14+seed+50);
    top.push([x,-Hh*prof+j1]);bot.push([x,Hh*prof+j2]);}
  return[top,bot];
}
function pathLens(top,bot){X.beginPath();top.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));for(let i=bot.length-1;i>=0;i--)X.lineTo(bot[i][0],bot[i][1]);X.closePath()}
function pathLine(pts){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]))}
function lightning(x0,y0,ang,len,seed,t,w=2){
  const r=rng(seed+Math.floor(t*24)*7);
  function br(x,y,a,l,d){if(l<14||d>2)return;const n=4;let px=x,py=y;X.moveTo(px,py);
    for(let i=0;i<n;i++){a+=(r()-.5)*.9;px+=Math.cos(a)*l/n;py+=Math.sin(a)*l/n;X.lineTo(px,py);
      if(r()<.3){const sx=px,sy=py;br(sx,sy,a+(r()<.5?-1:1)*(.5+r()*.6),l*.5,d+1);X.moveTo(px,py)}}}
  glow(()=>br(x0,y0,ang,len,0),'#ffe2c0','#ff9050','#ff3a08',w,.75);
}
function darkBG(col='#0b090c'){X.fillStyle=col;X.fillRect(0,0,W,H);X.fillStyle=darkDots;X.fillRect(0,0,W,H)}
function paperBG(){X.fillStyle=PAPER;X.fillRect(0,0,W,H);X.fillStyle=gridPat;X.fillRect(0,0,W,H);
  const g=X.createRadialGradient(W/2,H/2,200,W/2,H/2,1200);g.addColorStop(0,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(120,110,100,.18)');X.fillStyle=g;X.fillRect(0,0,W,H)}

// ============================================================
//  SHOTS
// ============================================================
// S1  0.00-1.05  paper, katana idle, ink arcs orbit
function S1(t){
  paperBG();
  const cx=900,cy=520;
  for(const a of inkArcs){const st=a.a+t*a.sp*.9, k=eOut(seg(t,0,.25));
    brushArc(cx,cy,a.r,st,st+a.len*k,a.w*2,a.red?'#e0443e':INK,a.red?.8:.92)}
  if(t>.55){const k=eOut(seg(t,.55,1.05));X.save();X.globalAlpha=.55*k;X.beginPath();X.arc(700,560,560*k,0,TAU);X.fillStyle='rgba(240,170,170,.35)';X.fill();X.clip();X.fillStyle=dotPat(10,2.6,'rgba(200,40,50,.45)');X.fillRect(0,0,W,H);X.restore()}
  const pull=eIn(seg(t,.78,1.05))*60, sh=t>.9?(hash(t*99)-.5)*6:0;
  katana(940+sh,395,.035,.86,{t,out:pull,shadow:1});
  // red sparks at tsuba
  for(let i=0;i<4;i++){const a=-2.4+i*.35+t*.8;brushArc(940,395,70+i*14,a,a+.5,5,'#e8282a',.85)}
  if(t>.85){const f=seg(t,.85,1.05);X.save();X.globalCompositeOperation='lighter';const g=X.createRadialGradient(940,395-pull*.86,0,940,395,180*f+10);g.addColorStop(0,'rgba(255,245,200,1)');g.addColorStop(.4,'rgba(255,120,40,.6)');g.addColorStop(1,'rgba(255,60,20,0)');X.fillStyle=g;X.fillRect(0,0,W,H);X.restore()}
}
// comic spiky burst
function burst(cx,cy,r0,r1,n,seed,fill){const r=rng(seed);X.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU,rr=i%2?r0*(.8+r()*.3):r1*(.7+r()*.5);X.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}X.closePath();X.fillStyle=fill;X.fill()}
// red sun disc w/ halftone + rings
function sunDisc(cx,cy,r,alpha,ring){
  X.save();X.globalAlpha=alpha;
  const g=X.createRadialGradient(cx-r*.2,cy-r*.2,r*.1,cx,cy,r);g.addColorStop(0,'#c23a26');g.addColorStop(.7,'#7a140e');g.addColorStop(1,'#4a0a08');
  X.beginPath();X.arc(cx,cy,r,0,TAU);X.fillStyle=g;X.fill();
  X.save();X.clip();X.fillStyle=redDots;X.globalAlpha=alpha*.55;X.fillRect(cx-r,cy-r,2*r,2*r);X.restore();
  X.globalAlpha=alpha;
  for(let i=0;i<9;i++){const rr=r*(.86+i*.02);X.beginPath();X.arc(cx,cy,rr,0,TAU);X.strokeStyle=i%2?'#ff7b3a':'#c0281a';X.lineWidth=5;X.stroke()}
  X.restore();
  if(ring)glow(()=>{X.arc(cx,cy,r*1.02,0,TAU)},'#ffe6c8','#ff8a4a','#ff3a10',6,ring);
}
function orbitStreaks(cx,cy,t,alpha,spin){
  for(const s of streaks){const st=s.a+t*s.sp*spin, r=s.r;

// catmull-rom through keys (continuous velocity, for flying objects)
function cr(t,keys){

  katana(lerp(420,240,eIn(seg(T,0,.3))),lerp(990,1150,eIn(seg(T,0,.3))),-1.5,.95,{t,charms:false});
}

// ============================================================
//  SHOT E  3.833 – 4.767   the line tears open (rift)
// ============================================================
const debris=[...Array(90)].map(()=>({u:GR(),o:(GR()-.5)*60,s:5+GR()*16,vx:(GR()-.5)*140,vy:(GR()-.5)*160,rot:GR()*TAU,vr:(GR()-.5)*9,hot:GR()<.45}));
const spikes=[...Array(46)].map(()=>({u:GR()*2-1,side:GR()<.5?-1:1,len:160+GR()*420,w:10+GR()*26,d:GR()*.12,lean:(GR()-.5)*.5}));
function shotE(t){
  const T=t-3.833;

  X.fillStyle='#120708';X.fillRect(0,0,W,H);
  const g=X.createRadialGradient(960,520,40,960,520,1100);g.addColorStop(0,'#6a2414');g.addColorStop(.6,'#2a0d0a');g.addColorStop(1,'#0c0607');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle=darkDots;X.fillRect(0,0,W,H);
  X.save();X.translate(960,520);X.rotate(-.29);

  const openAt=x=>eOut(seg(T,.12+(x+1150)/2300*.07,.12+(x+1150)/2300*.07+.12));
  const Hh=250, cool=sm(seg(t,4.3,4.68));

    const j1=7*noise1(u*18+t*14),j2=7*noise1(u*18+t*14+50);top.push([x,-(Hh*prof*o+2)+j1*o]);bot.push([x,(Hh*prof*o+2)+j2*o]);}

  for(const s of spikes){const k=eOut(seg(T,.13+s.d,.13+s.d+.25));if(k<=0)continue;const x=s.u*1000,prof=Math.pow(1-s.u*s.u,.85);

  [0,.2,.5,.8,1].forEach((s,i)=>{const a=hot[i],b=cold[i];ig.addColorStop(s,mixHex(a,b,cool))});X.fillStyle=ig;X.fill();
  // hot rims

   for(let i=0;i<9;i++){const y=(hash(i)-.5)*Hh*.9*om,x0=-900+hash(i+3)*500;X.strokeStyle=`rgba(255,${200+hash(i)*55|0},170,${.5*(1-cool)})`;X.lineWidth=2+hash(i+5)*3;X.beginPath();X.moveTo(x0,y);X.lineTo(x0+500+hash(i+7)*700,y-40*hash(i+1));X.stroke()}X.restore()}
  if(T<.16){glow(()=>{X.moveTo(-1150,0);X.lineTo(1150,0)},'#ffe8d8','#ff7a4a','#ff3010',2.4,1)}
  if(T>.2)for(const b of bolts)lightning(b.u*900,b.side*Hh*Math.pow(1-b.u*b.u,.85),b.side*Math.PI/2+(hash(b.seed)-.5),b.len*.8,b.seed,t,1.4);
  X.restore();
  // debris torn off the line
  for(const d of debris){const k=T;const bx=lerp(-60,1980,d.u),by=lerp(820,230,d.u)+d.o;
    X.save();X.translate(bx+d.vx*k,by+d.vy*k);X.rotate(d.rot+d.vr*k);
    if(d.hot){X.globalCompositeOperation='lighter';X.fillStyle='#ffd8a0';X.beginPath();X.arc(0,0,d.s*.22,0,TAU);X.fill()}
    else{X.fillStyle='#24161a';X.beginPath();X.moveTo(0,-d.s);X.lineTo(d.s*.9,d.s*.5);X.lineTo(-d.s*.6,d.s*.6);X.closePath();X.fill()}X.restore()}

}
function mixHex(a,b,k){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=[16,8,0].map(s=>Math.round(lerp(pa>>s&255,pb>>s&255,k)));return`rgb(${c})`}

// ============================================================
//  SHOTS F/G  4.8 – 9.25   eye (slit -> vortex) — reuse eye()
// ============================================================
const eyeT=t=>t<7.85?lerp(3.983,7.567,(t-4.8)/(7.85-4.8)):lerp(7.567,8.6,(t-7.85)/(9.25-7.85));
let BLINK=1;
function shotF(t){BLINK=1-.96*Math.sin(Math.PI*seg(t,7.17,7.42));const k=1+.05*eOut(seg(t,4.8,9.25));
  X.save();X.translate(960,540);X.scale(k,k);X.translate(-960,-540);
  if(t<7.85)S5(eyeT(t));else S6(eyeT(t));X.restore();BLINK=1}

// ============================================================
//  SHOT H  9.25 – 9.787   second slash through the eye
// ============================================================
function shotH(t){
  const T=t-9.25;
  X.save();S7(lerp(8.6,9.317,seg(t,9.25,9.787)));X.restore();
  if(T<.05){const p=eOut5(seg(T,-.03,.04));bladeSlash(lerp(2300,-300,p)+400,lerp(160,860,p)-100,2300,160,110,1)}
}
// ============================================================
//  SHOT I  9.787 – 10.4   halftone shatter: darkness eaten by paper
// ============================================================
const lay=mk(W,H),layX=lay.getContext('2d');
function htField(x,y){ // when each dot dissolves (0..1): slash band first, then noise
  const u=(x-960)*Math.cos(.33)+(y-560)*Math.sin(.33),v=-(x-960)*Math.sin(.33)+(y-560)*Math.cos(.33);
  const band=clamp(Math.abs(v+40)/520);const n=.5+.5*noise1(x*.004+y*.007)+.25*noise1(x*.013-y*.011+9);
  return clamp(band*.55+n*.5-.05);
}
function shotI(t){
  const T=t-9.787,p=lerp(.12,1.08,Math.pow(seg(t,9.82,10.78),1.1));
  paperBG2();
  // ghost brush swathes on paper
  X.save();X.globalAlpha=.3;X.strokeStyle='#bdb7b4';X.lineCap='round';for(let i=0;i<4;i++){X.lineWidth=70;X.beginPath();X.moveTo(150+i*80,360+i*120);X.lineTo(1500+i*60,140+i*120);X.stroke()}X.restore();
  // dark layer = frozen eye, drawn into C then copied
  window.NORIM=1;X.save();S6(8.4);X.restore();window.NORIM=0;layX.globalCompositeOperation='copy';layX.drawImage(C,0,0);layX.globalCompositeOperation='source-over';
  paperBG2();X.save();X.globalAlpha=.3;X.strokeStyle='#bdb7b4';X.lineCap='round';for(let i=0;i<4;i++){X.lineWidth=70;X.beginPath();X.moveTo(150+i*80,360+i*120);X.lineTo(1500+i*60,140+i*120);X.stroke()}X.restore();
  // mask: keep darkness where field > p, as halftone dots near the edge
  const st=24;layX.globalCompositeOperation='destination-in';const m=mk(W,H),mx=m.getContext('2d');mx.fillStyle='#000';
  for(let y=0;y<H+st;y+=st)for(let x=(Math.floor(y/st)%2)*st/2;x<W+st;x+=st){const f=htField(x,y)-p;if(f<=-.02)continue;const r=st*.78*clamp(f*7+.12);mx.beginPath();mx.arc(x,y,r,0,TAU);mx.fill()}
  layX.drawImage(m,0,0);layX.globalCompositeOperation='source-over';X.drawImage(lay,0,0);
  // coloured pixel-fragments along the dissolve front
  for(let y=0;y<H;y+=st*.62)for(let x=0;x<W;x+=st*.62){const f=htField(x,y)-p;if(f<-.06||f>.03)continue;const h=hash(x*.37+y*1.7);
    X.fillStyle=h<.45?RED:h<.75?'#efe2cc':INK;X.globalAlpha=.95;X.beginPath();X.arc(x,y,4+hash(x*.11+y*.3)*3.5,0,TAU);X.fill()}
  X.globalAlpha=1;
  // the paper slash band with red ink lines
  X.save();X.translate(960,520);X.rotate(-.33);X.fillStyle='#efece6';X.beginPath();X.moveTo(-1200,-38);X.quadraticCurveTo(0,-70,1200,-80);X.lineTo(1200,-10);X.quadraticCurveTo(0,10,-1200,40);X.closePath();X.fill();
  for(let i=0;i<5;i++){X.strokeStyle=i%2?'#7a0d18':RED;X.lineWidth=2+hash(i)*5;X.beginPath();X.moveTo(-1200,-20+i*10);X.quadraticCurveTo(0,-40+i*9,1200,-60+i*9);X.stroke()}X.restore();
  // ink & ember dots flying
  for(const d of inkDots){X.fillStyle=d.col;X.globalAlpha=.9;X.beginPath();X.arc(d.x+d.vx*T*.6,d.y+d.vy*T*.6,d.s*.6,0,TAU);X.fill()}X.globalAlpha=1;
  if(t>10.15)redBand(seg(t,10.15,10.35));
  {const[hx,hy,ha]=cr(t,SHEATH);katana(hx,hy,ha-Math.PI/2,.9,{t,charms:true,noHilt:1});}
  if(t>10.02)swordAct(t);
}
// ============================================================
//  SHOT J  10.4 – 11.98   paper · swing · sheathe · shockwave
// ============================================================
// sword pose: tsuba x,y, blade direction angle (blade points along +y local => rot = dir - PI/2)
const SWING=[[10.0,-150,120,.75],[10.25,560,90,.9],[10.45,960,60,1.55],[10.58,1150,190,.18],[10.72,1130,200,1.6],[10.86,1440,480,2.45],[11.0,1620,470,3.05],[11.12,1560,410,2.8],[11.25,1460,385,2.8],[11.45,1150,495,2.8],[11.62,980,560,2.8]];
const SHEATH=[[10.0,80,1150,2.8],[10.5,330,880,2.8],[10.95,880,610,2.8],[11.2,960,560,2.8],[11.62,980,560,2.8]];
function swordPose(t){return cr(t,SWING)}
function swordAct(t){
  // smear: crescent from tip history (motion trail)
  const N=10,tips=[],mids=[];
  for(let i=0;i<=N;i++){const tt=t-i*.012;if(tt<10.0)break;const[x,y,a]=swordPose(tt);tips.push([x+Math.cos(a)*560,y+Math.sin(a)*560]);mids.push([x+Math.cos(a)*400,y+Math.sin(a)*400])}
  if(tips.length>3&&t<11.08){const P=tips.concat(mids.reverse());const sp=Math.hypot(tips[0][0]-tips[tips.length-1][0],tips[0][1]-tips[tips.length-1][1]);
    if(sp>120){X.save();X.globalAlpha=clamp((sp-120)/300);X.fillStyle='rgba(200,16,30,.9)';X.beginPath();tips.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));
      const inner=tips.map((p,i)=>{const m=mids[mids.length-1-i];const k=i/(tips.length-1);return[lerp(p[0],m[0],.22*(1-k)+.02),lerp(p[1],m[1],.22*(1-k)+.02)]}).reverse();inner.forEach(p=>X.lineTo(p[0],p[1]));X.closePath();X.fill();
      X.strokeStyle=INK;X.lineWidth=3;X.beginPath();tips.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.restore()}}
  const[x,y,a]=swordPose(t);
  X.save();X.translate(x,y);X.rotate(a-Math.PI/2);X.scale(.88,.88);drawBlade(600);drawHilt();X.restore();
}
function redBand(bandA){X.save();X.translate(960,600);X.rotate(-.34);
  for(let i=0;i<11;i++){X.strokeStyle=i%3==0?INK:i%2?'#8a0d18':RED;X.globalAlpha=bandA*(i%3==0?.45:.9);X.lineWidth=1+hash(i+3)*4.5;const o=i*6+hash(i+8)*8,x0=-1150+hash(i+1)*200,x1=1150-hash(i+2)*250;X.beginPath();X.moveTo(x0,-40+o);X.quadraticCurveTo(0,-190+o,x1,-150+o*.8);X.stroke()}
  X.restore();X.globalAlpha=1}
function shotJ(t){
  paperBG2();
  const T=t-10.4;
  redBand(1-seg(t,11.7,12.0));
  // floating ink dots
  for(let i=0;i<70;i++){const x=hash(i)*W+Math.sin(t*.7+i)*14,y=hash(i+40)*H+Math.cos(t*.6+i)*10;X.fillStyle=i%4==0?'rgba(20,16,20,.85)':i%4==1?'rgba(140,135,135,.5)':'rgba(205,20,32,.8)';X.beginPath();X.arc(x,y,(i%4==0?7:3)+hash(i+9)*4,0,TAU);X.fill()}
  const[hx,hy,ha]=cr(t,SHEATH);
  if(t<11.62){
    katana(hx,hy,ha-Math.PI/2,.9,{t,charms:true,noHilt:1});swordAct(t);
  } else {
    // sheathed: glowing slash then shockwave ring
    const g=seg(t,11.55,11.75),gf=1-seg(t,11.75,11.98);
    if(gf>0){X.save();X.translate(960,600);X.rotate(-.34);X.globalAlpha=g*gf;glow(()=>{X.moveTo(-1150,-60);X.quadraticCurveTo(0,-110,1150,-150)},'#fff8e8','#ffb070','#ff4a1a',16,1);X.restore()}
    const zk=1+.08*eOut(seg(t,11.62,11.98));
    katana(lerp(980,1010,seg(t,11.62,11.98)), lerp(560,540,seg(t,11.62,11.98)),ha-Math.PI/2+.02*eOut(seg(t,11.62,11.98)),.9*zk,{t,charms:true});
    const rk=seg(t,11.64,11.98);if(rk>0&&rk<1){X.save();X.globalAlpha=1-rk;X.strokeStyle='#c8202a';X.lineWidth=lerp(7,1.5,rk);X.beginPath();X.arc(990,560,lerp(60,560,eOut(rk)),0,TAU);X.stroke();
      if(rk<.4){X.strokeStyle=INK;X.lineWidth=2;for(let i=0;i<10;i++){const a=i/10*TAU+.3,r0=lerp(40,200,rk);X.beginPath();X.moveTo(990+Math.cos(a)*r0,560+Math.sin(a)*r0);X.lineTo(990+Math.cos(a)*(r0+60+hash(i)*60),560+Math.sin(a)*(r0+60+hash(i)*60));X.stroke()}}X.restore()}
  }
}
// ============================================================
//  SHOT K  11.98 – 14.6   close-up · snap upright · seal stamp
// ============================================================
function shotK(t){
  paperBG2();
  // drifting red dots
  for(let i=0;i<34;i++){const x=hash(i)*W+Math.sin(t+i)*20,y=(hash(i+40)*H-(t-12)*30*hash(i+3)+H*3)%H;X.fillStyle=i%3?'rgba(200,20,30,.75)':'rgba(120,110,110,.5)';X.globalAlpha=1-seg(t,12.6,13.2);X.beginPath();X.arc(x,y,2+hash(i+9)*4,0,TAU);X.fill()}X.globalAlpha=1;
  // pose keys: close-up drift, then a whip to upright (overshoot), then rest — bookends the opening pose
  const up=seg(t,12.52,12.95);const e=eBack(up);
  const x=lerp(lerp(1250,1300,seg(t,11.98,12.52)),862,e),y=lerp(lerp(390,370,seg(t,11.98,12.52)),445,e);
  const rot=lerp(1.2,-.40,e)+.004*Math.sin(t*2), s=lerp(1.55,.84,eOut(up));
  katana(x,y,rot,s,{t,shadow:1});
  // stamp: ghost at 13.25, slam 13.33, splatter
  if(t>13.22){const p=seg(t,13.22,13.36);const sc=lerp(1.6,1,eOut5(p));stamp(1265,690,sc,lerp(.25,1,sm(p)),t);
    if(t>13.33){const k=eOut(seg(t,13.33,13.7));for(const sp of splat){const d=sp.d*k;X.fillStyle=`rgba(200,20,28,${.85*(1-seg(t,13.6,14.2))})`;X.beginPath();X.arc(1265+Math.cos(sp.a)*d*1.2,690+Math.sin(sp.a)*d,sp.s*(1-k*.3),0,TAU);X.fill()}}}
}

// ============================================================
//  MASTER (real time) + inversion frames + motion blur
// ============================================================
const INVERT=[[3.033,3.049],[4.767,4.8],[9.266,9.3],[9.787,9.82]];
function render2(t){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.filter='none';
  const[shx,shy,shr]=shake(t);
  X.setTransform(1.03,0,0,1.03,-W*.015+shx,-H*.015+shy);if(shr){X.translate(W/2,H/2);X.rotate(shr);X.translate(-W/2,-H/2)}
  let dark=true,bl=0;
  if(t<1.067){shotA(t);dark=false}
  else if(t<2.967){shotB(t);bl=.5}
  else if(t<3.333){shotC(t);bl=.5}
  else if(t<3.833){shotD(t);bl=.35}
  else if(t<4.8){shotE(t);bl=.45}
  else if(t<9.25){shotF(t);bl=.22}
  else if(t<9.787){shotH(t);bl=.5}
  else if(t<10.9){shotI(t);dark=false}
  else if(t<11.98){shotJ(t);dark=false}
  else {shotK(t);dark=false}
  X.setTransform(1,0,0,1,0,0);
  bloom(bl);if(dark)vignette(.5);
  // eye-flash frame: white with black slit (4.767)
  if(t>=4.767&&t<4.8){X.fillStyle='#fff';X.fillRect(0,0,W,H);X.fillStyle='#000';X.save();X.translate(1180,350);X.rotate(-.12);X.beginPath();X.ellipse(0,0,14,110,0,0,TAU);X.fill();X.restore()}
  for(const[a,b]of INVERT){if(t>=a&&t<b+.0001&&a!==4.767){X.globalCompositeOperation='difference';X.fillStyle='#fff';X.fillRect(0,0,W,H);X.globalCompositeOperation='source-over';tmpX.globalCompositeOperation='copy';tmpX.drawImage(C,0,0);X.filter='hue-rotate(180deg)';X.globalCompositeOperation='copy';X.drawImage(tmpC,0,0);X.filter='none';X.globalCompositeOperation='source-over'}}
  // title card 0 – 3.45
  const ta=t<3.33?1:1-seg(t,3.33,3.45);titleCard(t,t>1.067,ta);
}
// sub-frame motion blur: average k renders across the shutter
const acc=mk(W,H),accX=acc.getContext('2d');
function renderMB(t,k=4,shutter=1/120){
  if(k<=1){render2(t);return}
  for(let i=0;i<k;i++){render2(t-shutter*(i/(k-1)));accX.globalAlpha=1/(i+1);accX.drawImage(C,0,0)}
  accX.globalAlpha=1;X.setTransform(1,0,0,1,0,0);X.globalCompositeOperation='copy';X.drawImage(acc,0,0);X.globalCompositeOperation='source-over';
}
window.render=t=>renderMB(t,window.MBK||1);
